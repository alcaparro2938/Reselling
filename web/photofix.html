<title>Photofix</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column of photo cards under a sticky header, a fixed action bar at the bottom; two columns on wide screens. */
:root {
  --bg: #f3f4f2;
  --surface: #ffffff;
  --ink: #18201c;
  --muted: #5f6b65;
  --line: #dde2de;
  --accent: #17684f;
  --accent-ink: #ffffff;
  --accent-soft: #e2efe9;
  --warn: #8a5a00;
  --warn-soft: #fbf1dc;
  --danger: #a3341b;
  --shade: rgba(16, 24, 20, .62);
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121614; --surface: #1b211e; --ink: #e8ece9; --muted: #9aa6a0;
    --line: #2c3430; --accent: #4fbf96; --accent-ink: #0c1712; --accent-soft: #1f3a2f;
    --warn: #e7b65c; --warn-soft: #33290f; --danger: #f08b70; --shade: rgba(0, 0, 0, .66);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121614; --surface: #1b211e; --ink: #e8ece9; --muted: #9aa6a0;
  --line: #2c3430; --accent: #4fbf96; --accent-ink: #0c1712; --accent-soft: #1f3a2f;
  --warn: #e7b65c; --warn-soft: #33290f; --danger: #f08b70; --shade: rgba(0, 0, 0, .66);
  color-scheme: dark;
}
html { -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 16px; }
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  padding-block: 14px 10px; display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--line);
}
.mark {
  width: 34px; height: 34px; border-radius: 9px; background: var(--accent);
  display: grid; place-items: center; flex: none;
}
.mark svg { width: 20px; height: 20px; }
header h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
header p { margin: 0; color: var(--muted); font-size: 13px; }

.pick {
  display: grid; gap: 4px; place-items: center; text-align: center; cursor: pointer;
  border: 2px dashed var(--line); border-radius: var(--radius); background: var(--surface);
  padding-block: 22px; padding-inline: 16px;
}
.pick:hover, .pick.over { border-color: var(--accent); background: var(--accent-soft); }
.pick:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.pick strong { font-family: var(--font-display); font-size: 18px; font-weight: 700; }
.pick span { color: var(--muted); font-size: 13px; }
.pick input { position: absolute; width: 1px; height: 1px; opacity: 0; }

details.settings { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
details.settings summary {
  cursor: pointer; list-style: none; padding: 13px 16px; font-weight: 600;
  display: flex; justify-content: space-between; align-items: center;
}
details.settings summary::-webkit-details-marker { display: none; }
details.settings summary::after { content: "Mostrar"; color: var(--muted); font-weight: 500; font-size: 13px; }
details.settings[open] summary::after { content: "Ocultar"; }
.grid-set { display: grid; gap: 14px; padding: 0 16px 16px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .grid-set { grid-template-columns: 1fr 1fr; } }
.grid-set label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.grid-set select, .grid-set input[type=range] { width: 100%; }
.grid-set select {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 9px 10px; min-height: 42px;
}
.grid-set .apply { grid-column: 1 / -1; }
.val { font-family: var(--font-data); color: var(--ink); }
.check { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--ink) !important; }

.cards { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .cards { grid-template-columns: 1fr 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; min-width: 0; }
.stage { position: relative; background: var(--bg); display: grid; place-items: center; min-height: 220px; }
.stage img { display: block; max-width: 100%; max-height: 64vh; width: auto; height: auto; object-fit: contain; -webkit-touch-callout: default; }
.flip {
  position: absolute; right: 8px; bottom: 8px; flex: none; min-height: 36px; padding: 6px 12px; font-size: 13px;
  background: var(--shade); color: #fff; border-color: transparent; border-radius: 999px;
}
.tag {
  position: absolute; top: 8px; font: 600 10px/1 var(--font-body); letter-spacing: .09em;
  background: var(--shade); color: #fff; padding: 5px 8px; border-radius: 6px; pointer-events: none;
}
.tag.l { left: 8px; } .tag.r { right: 8px; }
.tag.sample { background: var(--accent); color: var(--accent-ink); }
.busy-veil {
  position: absolute; inset: 0; display: grid; place-items: center; background: var(--shade);
  color: #fff; font-weight: 600; font-size: 14px;
}
.body { padding: 12px 14px 14px; display: grid; gap: 6px; }
.name { font-weight: 600; font-size: 14px; word-break: break-all; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 500 12px/1 var(--font-data); padding: 5px 8px; border-radius: 999px;
  background: var(--bg); border: 1px solid var(--line); color: var(--ink);
}
.chip.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.note { font-size: 13px; color: var(--warn); background: var(--warn-soft); border-radius: 8px; padding: 7px 9px; }
.err { font-size: 13.5px; color: var(--danger); }
.row { display: flex; gap: 8px; margin-top: 6px; }

button {
  font: inherit; font-weight: 600; font-size: 15px; padding: 10px 14px; min-height: 44px;
  border-radius: 11px; border: 1px solid var(--accent); background: var(--accent);
  color: var(--accent-ink); cursor: pointer; flex: 1;
}
button.ghost { background: transparent; color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; gap: 10px; align-items: center;
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-top: 1px solid var(--line);
}
.bar .status { flex: 2; font-size: 13px; color: var(--muted); min-width: 0; }
.bar button { flex: 1; max-width: 240px; }
.hint { font-size: 13px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: no-preference) { .card { animation: rise .25s ease-out both; } }
@keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
</style>

<div class="wrap">
  <header>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--accent-ink)">
        <rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M3 8V4h4M21 8V4h-4M3 16v4h4M21 16v4h-4"/>
      </svg>
    </div>
    <div>
      <h1>Photofix</h1>
      <p>Pone el móvil de pie, lo endereza y lo centra. Las fotos no salen de tu dispositivo.</p>
    </div>
  </header>

  <label class="pick" id="pick">
    <input id="files" type="file" accept="image/*" multiple>
    <strong>Elegir fotos</strong>
    <span>Del carrete o hechas ahora. Mejor el original que una copia de WhatsApp.</span>
  </label>

  <details class="settings" id="settings">
    <summary>Ajustes</summary>
    <div class="grid-set">
      <div>
        <label for="fill">Tamaño del producto: <span class="val" id="fillv">78</span>%</label>
        <input id="fill" type="range" min="50" max="95" value="78">
      </div>
      <div>
        <label for="ratio">Formato</label>
        <select id="ratio">
          <option value="auto">Automático</option>
          <option value="0.8">4:5</option>
          <option value="1">1:1 cuadrado</option>
          <option value="0.75">3:4</option>
          <option value="0.6667">2:3</option>
        </select>
      </div>
      <label class="check"><input id="upright" type="checkbox" checked> Poner el móvil de pie</label>
      <label class="check"><input id="levels" type="checkbox" checked> Retoque suave de luz</label>
      <button class="ghost apply" id="apply" type="button">Aplicar a todas</button>
    </div>
  </details>

  <div class="cards" id="cards" aria-live="polite"></div>
  <p class="hint" id="hint"></p>
</div>

<div class="bar">
  <div class="status" id="status">Cargando el ejemplo…</div>
  <button id="saveAll" type="button" disabled>Guardar todas</button>
</div>

<script>
"use strict";
/* ======================================================================
   Engine: a JavaScript port of the photofix pipeline.

  function blur(src, w, h, taps) {
    const r = (taps.length - 1) / 2, tmp = new Float32Array(w * h), out = new Float32Array(w * h);

      tmp[y * w + x] = s;

    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {

  function hull(pts) {
    pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);

  function rowPoints(rows) { const p = []; rows.forEach((r, y) => { p.push([r[0], y]); if (r[1] !== r[0]) p.push([r[1], y]); }); return p; }

  function minAreaRect(points) {

          // A phone held edge-on shows neither camera nor island. What shows
          // is one edge, and which one says how it should stand: the long
          // side (buttons) stands vertical, the short bottom edge (the port)
          // lies horizontal. The side view is about twice as long for the
          // same thickness; on the seller's photos, with reflections and
          // fingers thickening the edge, they measured 3.4 and 5.8-6.8. The arm then picks between the two positions
          // left: it reaches in from below, never from above.
          // The phone is the biggest piece; fingernails, which are too pale to
          // pass for skin, come out as small pieces beside it and would skew
          // its proportions.
          const r = minAreaRect(rowPoints(fm.core[0].rows)), a = fm.armSides;
          if (r && Math.max(a.top, a.bottom, a.left, a.right) >= 0.05) {
            const aspect = Math.max(r.w, r.h) / Math.max(Math.min(r.w, r.h), 1);
            const long = r.w >= r.h ? [r.ux, r.uy] : [-r.uy, r.ux];
            const wantVertical = aspect >= 4.5, longVertical = Math.abs(long[1]) > Math.abs(long[0]);
            const bottomAfter = ["bottom", "left", "top", "right"], topAfter = ["top", "right", "bottom", "left"];
            let bestK = 0, bestScore = -Infinity;
            for (let k = 0; k < 4; k++) {
              if ((longVertical !== (k % 2 === 1)) !== wantVertical) continue;
              const score = a[bottomAfter[k]] - a[topAfter[k]] - (k ? 0.01 : 0);
              if (score > bestScore) { bestScore = score; bestK = k; }
            }
            report.turnCw = ((4 - bestK) % 4) * 90;
          }
          report.turnWhy = "hand";
        } else if (!sure) {
          const k = textTurn(img, W, H, seg);
          if (k != null) { report.turnCw = ((4 - k) % 4) * 90; report.turnWhy = "text"; }
          else report.turnUnsure = "no se ve la cámara ni la Dynamic Island, y el texto es demasiado pequeño para saber cuál es arriba (con el original del carrete suele bastar)";
        }
      }
      // Held in a hand, the phone is what has to stand straight, not the
      // outline of the hand around it.
      report.angle = held ? estimateAngle(work, { kept: fm.core, mask: fm.coreMask }) : estimateAngle(work, seg);
      A = (-report.turnCw + report.angle) * Math.PI / 180;
      // Subject bounds in rotated, full-resolution space.
      const c = Math.cos(A), s = Math.sin(A), k = work.k, cx = W / 2, cy = H / 2;
      const subject = held ? fm.core : seg.kept;
      const forbid = (x, y) => {
        const ox = (c * x - s * y + cx) * k, oy = (s * x + c * y + cy) * k;
        const ix = Math.floor(ox), iy = Math.floor(oy);
        return ix >= 0 && iy >= 0 && ix < seg.w && iy < seg.h && fm.forbidden[iy * seg.w + ix] === 1;
      };
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      for (const comp of subject) comp.rows.forEach((r, y) => { for (const x of [r[0], r[1] + 1]) for (const yy of [y, y + 1]) {
        const px = x / k - cx, py = yy / k - cy, rx = c * px + s * py, ry = -s * px + c * py;
        if (rx < x0) x0 = rx; if (rx > x1) x1 = rx; if (ry < y0) y0 = ry; if (ry > y1) y1 = ry; } });
      const sub = { x0, y0, x1, y1 };
      // Held in a hand, the hand is part of the picture: the product gets
      // about half the frame, and the frame is squarish so the hand fits.
      const fill = held ? Math.min(opts.fill, 0.5) : opts.fill;
      const shapes = held ? [5 / 4, 1, 4 / 5] : null, moreShapes = held ? [3 / 4, 2 / 3, 4 / 3] : null;
      // In a hand the phone sits above the hand that holds it, so it may sit
      // a little high; side to side it is always centred.
      const tolY = held ? 0.15 : 0.03;
      crop = planCrop(sub, W, H, A, fill, opts.ratio, forbid, shapes, tolY, moreShapes);
      if (crop.overflow || crop.trimmed) {
        // Nothing clean fits: better a little clutter than a cut product.
        crop = planCrop(sub, W, H, A, fill, opts.ratio, null, shapes, tolY, moreShapes);
        report.notes.push("No se ha podido dejar fuera todo lo que rodea al producto sin cortarlo.");
      }
      if (held) report.hand = true;
      if (crop.trimmed) report.notes.push("El producto se sale de la foto, así que el encuadre corta un poco por ese lado.");
      else if (crop.f < 0.6 && !crop.overflow) report.notes.push("El producto está muy cerca del borde de la foto: se ha dejado menos margen del pedido.");
      if (crop.overflow) report.notes.push("El producto toca el borde de la foto: las esquinas se han rellenado con el color del fondo.");
      report.dropped = seg.dropped;
    }
    const scale = Math.min(1, MAX_OUT / Math.max(crop.cw, crop.ch));
    const ow = Math.max(1, Math.round(crop.cw * scale)), oh = Math.max(1, Math.round(crop.ch * scale));
    const cv = document.createElement("canvas"); cv.width = ow; cv.height = oh;
    const ctx = cv.getContext("2d", { willReadFrequently: true });
    ctx.fillStyle = "rgb(" + seg.bg.map(Math.round).join(",") + ")"; ctx.fillRect(0, 0, ow, oh);
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    const c = Math.cos(A), s = Math.sin(A);
    ctx.setTransform(scale, 0, 0, scale, -crop.x0 * scale, -crop.y0 * scale);
    ctx.transform(c, -s, s, c, 0, 0);
    ctx.translate(-W / 2, -H / 2);
    ctx.drawImage(img, 0, 0);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (opts.levels) levels(ctx, ow, oh, 0.5);
    report.size = [ow, oh];
    if (Math.max(ow, oh) < 1000) report.notes.push("Ha salido pequeña (" + ow + "×" + oh + " px) porque la foto de partida lo es. Usa el original del carrete, no una copia de WhatsApp ni una captura.");
    const blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.92));
    cv.width = cv.height = 0;
    return { blob, report };
  }
  return { process, loadImage, turnsFor, foldDeg, _segment: segment };
})();

/* ======================================================================
   Interface
   ====================================================================== */
const $ = id => document.getElementById(id);
const cards = $("cards"), statusEl = $("status"), saveAllBtn = $("saveAll"), hint = $("hint");
let items = [], busy = false, downloads = null, nextId = 1;

function opts() {
  const r = $("ratio").value;
  return { fill: parseInt($("fill").value, 10) / 100, ratio: r === "auto" ? null : parseFloat(r), upright: $("upright").checked, levels: $("levels").checked };
}
function setStatus(t) { statusEl.textContent = t; }
function setBusy(on, t) { busy = on; if (t != null) setStatus(t); $("apply").disabled = on; saveAllBtn.disabled = on || !items.some(i => i.result && !i.sample); document.querySelectorAll(".card button").forEach(b => b.disabled = on); }
const stem = n => n.replace(/\.[^.]+$/, "");
const fmtDeg = a => (a > 0 ? "+" : "") + a.toFixed(1).replace(".", ",") + "°";

function chipsFor(rep) {
  const out = [];
  if (rep.turnCw) out.push(["girada " + rep.turnCw + "°" + (rep.turnWhy === "manual" ? " a mano" : rep.turnWhy === "camera" ? " · cámara" : rep.turnWhy === "island" ? " · Dynamic Island" : rep.turnWhy === "hand" ? " · por la mano" : rep.turnWhy === "text" ? " · por el texto" : ""), true]);
  out.push([Math.abs(rep.angle) >= 0.05 ? "enderezada " + fmtDeg(rep.angle) : "ya estaba recta", Math.abs(rep.angle) >= 0.05]);
  if (rep.hand) out.push(["en la mano", false]);
  if (rep.dropped) out.push(["fuera " + rep.dropped + (rep.dropped === 1 ? " objeto" : " objetos"), true]);
  out.push([rep.size[0] + "×" + rep.size[1] + " px", false]);
  return out;
}

function render(item) {
  const card = item.el || document.createElement("div");
  card.className = "card"; item.el = card; card.textContent = "";
  if (item.error) {
    const b = document.createElement("div"); b.className = "body";
    const n = document.createElement("div"); n.className = "name"; n.textContent = item.name;
    const e = document.createElement("div"); e.className = "err"; e.textContent = "No se ha podido procesar: " + item.error;
    b.append(n, e); card.append(b); return card;
  }
  const stage = document.createElement("div"); stage.className = "stage";
  if (item.result) {
    // The original and the result rarely share a shape (a phone lying across
    // the frame comes out portrait), so a wipe between them says nothing.
    // A tap shows one or the other, each at its own shape.
    const after = document.createElement("img"); after.className = "after"; after.alt = "Foto corregida de " + item.name; after.src = item.result.url;
    const before = document.createElement("img"); before.className = "before"; before.alt = "Original de " + item.name; before.src = item.srcUrl; before.hidden = true;
    const tag = document.createElement("span"); tag.className = "tag r"; tag.textContent = "DESPUÉS";
    const flip = document.createElement("button"); flip.type = "button"; flip.className = "flip"; flip.textContent = "Ver original";
    stage.append(after, before, tag, flip);
    if (item.sample) { const t = document.createElement("span"); t.className = "tag l sample"; t.textContent = "EJEMPLO"; stage.append(t); }
    const show = orig => { before.hidden = !orig; after.hidden = orig; tag.textContent = orig ? "ANTES" : "DESPUÉS"; flip.textContent = orig ? "Ver corregida" : "Ver original"; };
    flip.addEventListener("click", () => show(after.hidden === false));
  }
  if (item.working) { const v = document.createElement("div"); v.className = "busy-veil"; v.textContent = "Procesando…"; stage.append(v); }
  card.append(stage);

  const body = document.createElement("div"); body.className = "body";
  const n = document.createElement("div"); n.className = "name"; n.textContent = item.sample ? "Ejemplo: brillo de un iPhone tumbado" : item.name; body.append(n);
  if (item.result) {
    const rep = item.result.report, facts = document.createElement("div"); facts.className = "facts";
    for (const [t, on] of chipsFor(rep)) { const c = document.createElement("span"); c.className = "chip" + (on ? " on" : ""); c.textContent = t; facts.append(c); }
    body.append(facts);
    for (const t of rep.notes) { const d = document.createElement("div"); d.className = "note"; d.textContent = t; body.append(d); }
    if (!rep.turnCw && rep.turnUnsure && !item.sample) { const d = document.createElement("div"); d.className = "note"; d.textContent = "No se ha girado: " + rep.turnUnsure + ". Si no está de pie, usa Girar."; body.append(d); }
    const row = document.createElement("div"); row.className = "row";
    const turn = document.createElement("button"); turn.type = "button"; turn.className = "ghost"; turn.textContent = "Girar ↻"; turn.setAttribute("aria-label", "Girar 90 grados a la derecha");
    turn.addEventListener("click", () => turnOne(item));
    row.append(turn);
    if (!item.sample) { const save = document.createElement("button"); save.type = "button"; save.textContent = "Guardar"; save.addEventListener("click", () => saveOne(item)); row.append(save); }
    body.append(row);
  }
  card.append(body);
  return card;
}

async function run(item) {
  item.working = true; render(item);
  try {
    const img = await PF.loadImage(item.srcUrl);
    const o = opts(); o.turnCw = item.manualTurn;
    const res = await PF.process(img, o);
    if (item.result) URL.revokeObjectURL(item.result.url);
    item.result = { blob: res.blob, url: URL.createObjectURL(res.blob), report: res.report };
    item.error = null;
  } catch (e) { item.error = e && e.message ? e.message : String(e); }
  item.working = false; render(item);
  await new Promise(r => setTimeout(r, 0));
}

async function addFiles(fileList) {
  const files = [...fileList].filter(f => f.type.startsWith("image/") || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name));
  if (!files.length || busy) return;
  // The example makes way for the seller's own photos.
  for (const it of items.filter(i => i.sample)) { it.el.remove(); }
  items = items.filter(i => !i.sample);
  const fresh = files.map(f => ({ id: nextId++, name: f.name, srcUrl: URL.createObjectURL(f), manualTurn: null }));
  items.push(...fresh);
  for (const it of fresh) cards.append(render(it));
  setBusy(true);
  for (let i = 0; i < fresh.length; i++) { setStatus("Procesando " + (i + 1) + " de " + fresh.length + "…"); await run(fresh[i]); }
  setBusy(false, items.length + (items.length === 1 ? " foto lista" : " fotos listas"));
  updateHint();
}

async function turnOne(item) {
  if (busy) return;
  item.manualTurn = ((item.result ? item.result.report.turnCw : 0) + 90) % 360;
  setBusy(true, "Girando…"); await run(item); setBusy(false, "Girada " + item.manualTurn + "°");
}

async function applyAll() {
  if (busy || !items.length) return;
  setBusy(true);
  for (let i = 0; i < items.length; i++) { setStatus("Aplicando " + (i + 1) + " de " + items.length + "…"); await run(items[i]); }
  setBusy(false, "Ajustes aplicados");
}

function outName(item) { return stem(item.name) + "-lista.jpg"; }
async function saveOne(item) {
  if (!item.result) return;
  if (!downloads) { setStatus("Mantén pulsada la foto y elige «Guardar en Fotos»."); return; }
  try { await downloads.save({ filename: outName(item), data: item.result.blob }); setStatus("Guardada: " + outName(item)); }
  catch (e) { const c = e && e.code; setStatus(c === "declined" ? "No se ha guardado." : c === "rate_limited" ? "Espera un momento y vuelve a pulsar Guardar." : c === "host_unavailable" ? "Esta app no puede guardar archivos: ábrela en el navegador." : "No se ha podido guardar. Mantén pulsada la foto para guardarla."); }
}

// One after another, each through the share sheet, because that is where
// iOS offers "Guardar imagen", which puts it in the camera roll. A .zip would
// land in Files instead, which is no use for a listing.
async function saveAll() {
  const ready = items.filter(i => i.result && !i.sample);
  if (!ready.length || busy) return;
  if (!downloads) { setStatus("Mantén pulsada cada foto y elige «Guardar en Fotos»."); return; }
  setBusy(true);
  let saved = 0;
  for (let i = 0; i < ready.length; i++) {
    setStatus("Guardando " + (i + 1) + " de " + ready.length + ": toca «Guardar imagen»");
    let tries = 0;
    for (;;) {
      try { await downloads.save({ filename: outName(ready[i]), data: ready[i].result.blob }); saved++; break; }
      catch (e) {
        const c = e && e.code;
        if (c === "rate_limited" && tries++ < 3) { await new Promise(r => setTimeout(r, 1200)); continue; }
        setBusy(false, c === "declined" ? "Guardadas " + saved + " de " + ready.length + ". Has cancelado la siguiente." : "Guardadas " + saved + " de " + ready.length + ". No se ha podido guardar la siguiente.");
        return;
      }
    }
  }
  setBusy(false, saved === 1 ? "Foto guardada" : saved + " fotos guardadas");
}

function updateHint() {
  hint.textContent = downloads
    ? "Guardar abre la hoja de compartir del iPhone: toca «Guardar imagen» y va al carrete. «Guardar todas» las pasa una detrás de otra."
    : "Para guardar, mantén pulsada la foto corregida y elige «Guardar en Fotos».";
}

// Read-only view of the results, for checking the page from a test runner.
window.__photofixResults = () => items.map(i => ({ name: i.name, error: i.error || null, report: i.result ? i.result.report : null }));

// ---------- wiring ----------
$("files").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });
const pick = $("pick");
pick.addEventListener("dragover", e => { e.preventDefault(); pick.classList.add("over"); });
pick.addEventListener("dragleave", () => pick.classList.remove("over"));
pick.addEventListener("drop", e => { e.preventDefault(); pick.classList.remove("over"); addFiles(e.dataTransfer.files); });
$("fill").addEventListener("input", () => { $("fillv").textContent = $("fill").value; });
$("apply").addEventListener("click", applyAll);
saveAllBtn.addEventListener("click", saveAll);
try { const s = JSON.parse(localStorage.getItem("photofix-settings") || "null"); if (s) { $("fill").value = s.fill; $("fillv").textContent = s.fill; $("ratio").value = s.ratio; $("upright").checked = s.upright; $("levels").checked = s.levels; } } catch (e) {}
for (const id of ["fill", "ratio", "upright", "levels"]) $(id).addEventListener("change", () => {
  try { localStorage.setItem("photofix-settings", JSON.stringify({ fill: $("fill").value, ratio: $("ratio").value, upright: $("upright").checked, levels: $("levels").checked })); } catch (e) {}
});

(async () => {
  updateHint();
  const sample = { id: nextId++, name: "ejemplo.jpg", srcUrl: "ejemplo.jpg", manualTurn: null, sample: true };
  items.push(sample); cards.append(render(sample));
  setBusy(true);
  await run(sample);
  setBusy(false, sample.error ? "Elige tus fotos para empezar." : "Así queda una foto. Elige las tuyas.");
  if (window.claude && window.claude.use) {
    try { downloads = await window.claude.use("downloads"); } catch (e) { downloads = null; }
    updateHint(); setBusy(busy);
  }
})();
</script>
